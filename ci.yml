# ProductService
    - name: Build & Push ProductService
      run: |
        docker build -t $DOCKER_REGISTRY/productservice:${TAG} -f ProductService/Dockerfile ./ProductService
        docker push $DOCKER_REGISTRY/productservice:${TAG}
        docker tag $DOCKER_REGISTRY/productservice:${TAG} $DOCKER_REGISTRY/productservice:latest
        docker push $DOCKER_REGISTRY/productservice:latest

